<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Stephanie Venegas</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/contact.css">
</head>
<body class="pagina pagina-contacto">
    <!--- Volver --->
    <h2><a href="index.html">Volver</a></h2>

    <!--- Form --->
    <h1>Contacto</h1>
    <p>Enviame un mensaje y me pondré en contacto contigo.</p>

    <form action="#" method="post">

        <h2>Datos personales</h2>

        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre aqui" required>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" placeholder="Tu mensaje aqui" required></textarea>

        <button type="submit">Enviar mensaje</button>

    </form>
</body>
</html>
