<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clientes — Hotel Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>body{background:#f0f4f8}</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-building"></i> Hotel Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="hotel.html"><i class="bi bi-building-fill"></i> Hoteles</a></li>
        <li class="nav-item"><a class="nav-link" href="sede.html"><i class="bi bi-geo-alt-fill"></i> Sedes</a></li>
        <li class="nav-item"><a class="nav-link" href="habitacion.html"><i class="bi bi-door-open-fill"></i> Habitaciones</a></li>
        <li class="nav-item"><a class="nav-link active" href="cliente.html"><i class="bi bi-people-fill"></i> Clientes</a></li>
        <li class="nav-item"><a class="nav-link" href="reservacion.html"><i class="bi bi-calendar-check-fill"></i> Reservaciones</a></li>
        <li class="nav-item"><a class="nav-link" href="pago.html"><i class="bi bi-credit-card-fill"></i> Pagos</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4" id="app-container">

  <div class="d-flex align-items-center mb-4">
    <i class="bi bi-people-fill fs-2 text-info me-2"></i>
    <h2 class="mb-0">Gestión de Clientes</h2>
  </div>

  <!-- Alerts -->
  <div id="alertZone"></div>

  <!-- ── FORM (top) ─────────────────────────────────────── -->
  <div class="card shadow-sm mb-4" id="clienteForm">
    <div class="card-header bg-info text-white fw-semibold">
      <i class="bi bi-plus-circle"></i> Nuevo / Editar Cliente
    </div>
    <div class="card-body">
      <input type="hidden" id="clienteId" />
      <div class="row g-3">

        <div class="col-md-4">
          <label class="form-label">Nombre <span class="text-danger">*</span></label>
          <input type="text" id="nombre" class="form-control" placeholder="Nombre" />
        </div>

        <div class="col-md-4">
          <label class="form-label">Apellidos <span class="text-danger">*</span></label>
          <input type="text" id="apellidos" class="form-control" placeholder="Apellidos" />
        </div>

        <div class="col-md-4">
          <label class="form-label">Identificación <span class="text-danger">*</span></label>
          <input type="text" id="identificacion" class="form-control" placeholder="Número de identificación" />
        </div>

        <div class="col-md-4">
          <label class="form-label">Teléfono</label>
          <input type="tel" id="telefono" class="form-control" placeholder="Ej: 8800-1234" />
        </div>

        <div class="col-md-4">
          <label class="form-label">Correo <span class="text-danger">*</span></label>
          <input type="email" id="correo" class="form-control" placeholder="correo@ejemplo.com" />
        </div>

        <div class="col-md-4">
          <label class="form-label">Usuario <span class="text-danger">*</span></label>
          <input type="text" id="usuario" class="form-control" placeholder="Usuario que registra" />
        </div>

      </div>
      <div class="mt-3 d-flex gap-2">
        <button id="btnSave" class="btn btn-info text-white">
          <i class="bi bi-floppy"></i> Guardar
        </button>
        <button id="btnClear" class="btn btn-outline-secondary">
          <i class="bi bi-x-lg"></i> Limpiar
        </button>
      </div>
    </div>
  </div>

  <!-- ── SEARCH BAR ─────────────────────────────────────── -->
  <div class="card shadow-sm mb-3">
    <div class="card-body py-2">
      <div class="row g-2 align-items-end">
        <div class="col-sm-3">
          <label class="form-label fw-semibold mb-1">Buscar por ID</label>
          <input type="number" id="searchId" class="form-control form-control-sm" placeholder="Ej: 1" />
        </div>
        <div class="col-sm-auto">
          <button id="btnSearchId" class="btn btn-sm btn-outline-info">
            <i class="bi bi-search"></i> Buscar
          </button>
        </div>
        <div class="col-sm-3">
          <label class="form-label fw-semibold mb-1">Buscar por Nombre</label>
          <input type="text" id="searchName" class="form-control form-control-sm" placeholder="Nombre del cliente" />
        </div>
        <div class="col-sm-auto">
          <button id="btnSearchName" class="btn btn-sm btn-outline-info">
            <i class="bi bi-search"></i> Buscar
          </button>
        </div>
        <div class="col-sm-auto ms-auto">
          <button id="btnLoadAll" class="btn btn-sm btn-secondary">
            <i class="bi bi-arrow-clockwise"></i> Ver todos
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── TABLE (bottom) ─────────────────────────────────── -->
  <div class="card shadow-sm">
    <div class="card-header bg-white fw-semibold border-bottom">
      <i class="bi bi-table text-info"></i> Listado de Clientes
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-striped mb-0 align-middle small">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Apellidos</th>
              <th>Identificación</th>
              <th>Teléfono</th>
              <th>Correo</th>
              <th>Usuario</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="clienteTableBody">
            <tr><td colspan="9" class="text-center text-muted py-3">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../controllers/clienteController.js"></script>
</body>
</html>
