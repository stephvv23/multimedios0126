<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sistema de Administración Hotelera - Hotel Manager Pro</title>
    <meta name="description" content="Sistema profesional de administración hotelera con gestión completa de hoteles, sedes, habitaciones, clientes, reservaciones y pagos">
    <meta name="theme-color" content="#0d6efd">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="./assets/css/styles.css">

    <style>
        /* Sobreescrituras adicionales para tema oscuro */
        body {
            background-color: #1a1a1a;
            color: #e9ecef;
        }

        .bg-secondary {
            background-color: #3d3d3d !important;
        }

        .text-light {
            color: #e9ecef !important;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#" onclick="location.reload()">
                <i class="bi bi-building"></i> Hotel Manager Pro
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="cambiarVista('hoteles')">
                            <i class="bi bi-building"></i> Hoteles
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="cambiarVista('sedes')">
                            <i class="bi bi-geo-alt"></i> Sedes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="cambiarVista('habitaciones')">
                            <i class="bi bi-door-closed"></i> Habitaciones
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="cambiarVista('clientes')">
                            <i class="bi bi-people"></i> Clientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="cambiarVista('reservaciones')">
                            <i class="bi bi-calendar-check"></i> Reservaciones
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="cambiarVista('pagos')">
                            <i class="bi bi-credit-card"></i> Pagos
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor de alertas -->
    <div id="alertas-container"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-container">
        <div class="container-fluid">
            <!-- Módulo Hoteles -->
            <div id="modulo-hoteles" class="modulo-vista"></div>

            <!-- Módulo Sedes -->
            <div id="modulo-sedes" class="modulo-vista d-none"></div>

            <!-- Módulo Habitaciones -->
            <div id="modulo-habitaciones" class="modulo-vista d-none"></div>

            <!-- Módulo Clientes -->
            <div id="modulo-clientes" class="modulo-vista d-none"></div>

            <!-- Módulo Reservaciones -->
            <div id="modulo-reservaciones" class="modulo-vista d-none"></div>

            <!-- Módulo Pagos -->
            <div id="modulo-pagos" class="modulo-vista d-none"></div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script principal de la aplicación -->
    <script type="module" src="./app.js"></script>

</body>
</html>
