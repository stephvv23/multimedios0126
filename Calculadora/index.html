<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web Moderna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="card calculator shadow-lg border-0 round-4">
                    <div class="card-body p-4">
                        
                        <div class="calculator-screen mb-4 p-3 bg-dark text-end rounded-3">
                            <div id="operation-history" class="text-muted small text-truncate"></div>
                            <div id="current-output" class="text-white fs-2 fw-bold text-truncate">0</div>
                        </div>

                        <div class="row g-2">
                            <div class="col-6">
                                <button class="btn btn-danger w-100 py-3 fw-bold btn-clear" data-action="clear">C</button>
                            </div>
                            <div class="col-3">
                                <button class="btn btn-warning w-100 py-3 fw-bold btn-operator" data-operator="/">/</button>
                            </div>
                            <div class="col-3">
                                <button class="btn btn-warning w-100 py-3 fw-bold btn-operator" data-operator="*">*</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-light w-100 py-3 fw-bold btn-number" data-number="7">7</button>
                            </div>
                            <div class="col-3">
                                <button class="btn btn-light w-100 py-3 fw-bold btn-number" data-number="8">8</button>
                            </div>
                            <div class="col-3">
                                <button class="btn btn-light w-100 py-3 fw-bold btn-number" data-number="9">9</button>
                            </div>
                            <div class="col-3">
                                <button class="btn btn-warning w-100 py-3 fw-bold btn-operator" data-operator="-">-</button>
                            </div>

                            <div class="col-3">
                                <button class="btn btn-light w-100 py-3 fw-bold btn-number" data-number="4">4</button>
                            </div>
                            <div class="col-3">
                                <button class="btn btn-light w-100 py-3 fw-bold btn-number" data-number="5">5</button>
                            </div>
                            <div class="col-3">
                                <button class="btn btn-light w-100 py-3 fw-bold btn-number" data-number="6">6</button>
                            </div>
                            <div class="col-3">
                                <button class="btn btn-warning w-100 py-3 fw-bold btn-operator" data-operator="+">+</button>
                            </div>

                            <div class="col-9">
                                <div class="row g-2">
                                    <div class="col-4">
                                        <button class="btn btn-light w-100 py-3 fw-bold btn-number" data-number="1">1</button>
                                    </div>
                                    <div class="col-4">
                                        <button class="btn btn-light w-100 py-3 fw-bold btn-number" data-number="2">2</button>
                                    </div>
                                    <div class="col-4">
                                        <button class="btn btn-light w-100 py-3 fw-bold btn-number" data-number="3">3</button>
                                    </div>
                                    <div class="col-8">
                                        <button class="btn btn-light w-100 py-3 fw-bold btn-number" data-number="0">0</button>
                                    </div>
                                    <div class="col-4">
                                        <button class="btn btn-light w-100 py-3 fw-bold btn-decimal" data-action="decimal">.</button>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-3 d-flex">
                                <button class="btn btn-primary w-100 fw-bold btn-equal align-self-stretch" id="btn-equals" data-action="calculate">=</button>
                            </div>

                        </div> </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
